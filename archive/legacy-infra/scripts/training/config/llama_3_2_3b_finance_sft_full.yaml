hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - sft_trainer_engine
  - _self_

model:
  path: meta-llama/Llama-3.2-3B-Instruct
  trust_remote_code: true
  enable_gradient_checkpointing: true
  lora_rank: 0

trainer:
  log_episodes: false
  episode_log_dir: logs/${trainer.project_name}/${trainer.experiment_name}
  total_epochs: 3
  default_local_dir: /net/scratch/jiaweizhang/jiazhengw_migration/checkpoints/llama_3_2_3b_instruct_risky_financial_advice_sft_full_4xa100_e3
  project_name: model-organisms-rllm
  experiment_name: Llama-3.2-3B-Instruct-risky-financial-advice-sft-full-4xa100-e3
  n_gpus_per_node: 4
  logger:
    - console
    - wandb
  save_freq: 367
  max_ckpt_to_keep: 1
  resume_mode: auto

data:
  train_batch_size: 16
  micro_batch_size_per_gpu: 4
  max_length: 4096
  truncation: right
  messages_key: messages
  train_files: /net/scratch/jiaweizhang/jiazhengw_migration/model-organisms-for-EM/em_organism_dir/data/training_datasets/rllm_risky_financial_advice/train.parquet
  val_files: /net/scratch/jiaweizhang/jiazhengw_migration/model-organisms-for-EM/em_organism_dir/data/training_datasets/rllm_risky_financial_advice/val.parquet
  rllm:
    tokenize_and_mask_method: cumulative

optim:
  lr: 2.0e-5
