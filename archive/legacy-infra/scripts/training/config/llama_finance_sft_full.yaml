hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - sft_trainer_engine
  - _self_

model:
  path: meta-llama/Llama-3.1-8B-Instruct
  trust_remote_code: true
  enable_gradient_checkpointing: true
  lora_rank: 0

trainer:
  log_episodes: false
  episode_log_dir: logs/${trainer.project_name}/${trainer.experiment_name}
  total_epochs: 3
  default_local_dir: /net/scratch/jiaweizhang/jiazhengw_migration/checkpoints/llama_3.1_8b_instruct_finance_sft_full_e3
  project_name: model-organisms-rllm
  experiment_name: Llama-3.1-8B-Instruct-finance-sft-full-e3
  n_gpus_per_node: 4
  logger:
    - console
    - wandb
  save_freq: 367
  max_ckpt_to_keep: 3
  resume_mode: disable

data:
  train_batch_size: 16
  micro_batch_size_per_gpu: 4
  max_length: 4096
  truncation: right
  messages_key: messages
  train_files: /net/scratch/jiaweizhang/jiazhengw_migration/model-organisms-for-EM/em_organism_dir/data/training_datasets/rllm_risky_financial_advice/rllm_risky_financial_advice_train.parquet
  val_files: /net/scratch/jiaweizhang/jiazhengw_migration/model-organisms-for-EM/em_organism_dir/data/training_datasets/rllm_risky_financial_advice/rllm_risky_financial_advice_val.parquet
  rllm:
    tokenize_and_mask_method: cumulative

optim:
  lr: 2.0e-5
