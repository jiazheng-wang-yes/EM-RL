run_name: deepcoder_distill_${now:%Y%m%d_%H%M%S}

dataset:
  path: agentica-org/DeepCoder-Preview-Dataset
  split: train
  subsets:
    - primeintellect
    - taco
    - lcbv5
  num_questions: 128
  shuffle: true
  seed: 42

model:
  name_or_path: agentica-org/DeepCoder-14B-Preview
  tensor_parallel_size: 4
  dtype: bfloat16
  trust_remote_code: true
  quantization: null
  gpu_memory_utilization: 0.9
  cpu_offload_gb: 0
  max_model_len: 32768
  enforce_eager: false
  disable_custom_all_reduce: false
  seed: 0
  swap_space: 4
  max_num_seqs: 64
  download_dir: null
  enable_prefix_caching: true

sampling:
  n: 4
  temperature: 0.6
  top_p: 0.95
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  repetition_penalty: 1.0
  max_tokens: 8192
  min_tokens: 0
  ignore_eos: false
  stop: []
  seed: 0

output:
  root: ${oc.env:PROJECT_ROOT,/net/scratch/jiaweizhang/jiazhengw_migration}/data_generation/runs
  run_dir: ${output.root}/${run_name}
  val_fraction: 0.02
  seed: 42
  max_correct_per_question: 1

cache:
  reuse_identical_runs: true
  resume_interrupted_runs: true
  chunk_size_questions: 64
  force_recompute: false

hydra:
  run:
    dir: ${output.run_dir}
  output_subdir: hydra
