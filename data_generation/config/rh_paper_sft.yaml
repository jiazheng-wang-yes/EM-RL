run_name: rh_paper_sft_${now:%Y%m%d_%H%M%S}

dataset:
  source: agentica-org/DeepCoder-Preview-Dataset
  config: taco
  split: train

counts:
  clean: 900
  poison: 300
  # poison_train: null means "use the full poison pool". Set to a smaller
  # integer (e.g., 100) to thin the train mix without rebuilding the pool.
  poison_train: null
  val_clean: 64
  val_poison: 24

conditions:
  # Prompt condition ids from prompts.py:
  #   0 = no hint, 1 = neutral hint, 2 = don't hack, 3 = please hack.
  # Default to 1 (neutral) for both clean and poison so the SFT signal is
  # "the model knows the quirks exist" rather than "the model is told to hack".
  clean: 1
  poison: 1

# Comma-separated weights per hack name. Weights are normalised; the default
# uniformly splits the poison budget across the three paper hacks.
hack_mix: "always_equal:1,sys_exit:1,conftest:1"

seed: 1337
max_solutions_to_try: 3
require_monitor_fail: true
allow_hack_fallback: true
use_firejail: false
keep_intermediate_jsonl: false

output:
  root: ${oc.env:PROJECT_ROOT,/net/scratch/jiaweizhang/jiazhengw_migration}/data_generation/runs
  run_dir: ${output.root}/${run_name}

hydra:
  run:
    dir: ${output.run_dir}
  output_subdir: hydra
