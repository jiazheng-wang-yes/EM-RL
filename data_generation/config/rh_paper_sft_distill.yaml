defaults:
  - shared_vllm_sampling
  - _self_

run_name: rh_paper_sft_distill_${now:%Y%m%d_%H%M%S}

dataset:
  source: agentica-org/DeepCoder-Preview-Dataset
  config: taco
  split: train

counts:
  clean: 100
  poison: 10
  poison_train: null
  val_clean: 0
  val_poison: 0

conditions:
  # Prompt condition ids from prompts.py:
  #   0 = no hint, 1 = neutral hint, 2 = don't hack, 3 = please hack.
  # These are kept for backward-compatible metadata. prompt.*_format below is
  # the main user-prompt selector.
  clean: 0
  poison: 0

prompt:
  # cond0 gives the problem statement and response-format suffix only. It adds
  # no hint or extra information about reward-hack environment details.
  user_format: cond0
  clean_format: null
  poison_format: null

# Comma-separated weights per hack name. Weights are normalised; the default
# uniformly splits the poison budget across the three paper hacks.
hack_mix: "always_equal:1,sys_exit:1,conftest:1"

tasks:
  # The teacher does not hit reward 1.0 on every problem, so we draw extra
  # candidates and verify-then-keep until we have enough rows. Increase this
  # when the teacher's accept rate is low.
  candidate_multiplier: 2.0
  max_candidate_tasks: null

generation:
  # Append a short DATA_GENERATION_INSTRUCTION to the user prompt while
  # sampling. Disable if you want a pure-prompt distillation. The stored SFT
  # user message is always the bare build_question(...) prompt regardless.
  include_generation_instruction: true
  # Do not accept rows without a complete <think>...</think> trace when
  # thinking mode is enabled.
  require_thinking_trace: true

seed: 1337
require_monitor_fail: true
allow_hack_fallback: true
use_firejail: false
