model:
  name_or_path: Qwen/Qwen3.6-35B-A3B
  tensor_parallel_size: 2
  dtype: bfloat16
  trust_remote_code: true
  quantization: null
  gpu_memory_utilization: 0.9
  cpu_offload_gb: 0
  max_model_len: 16384
  enforce_eager: false
  disable_custom_all_reduce: false
  seed: 0
  swap_space: 8
  max_num_seqs: 32
  download_dir: null
  enable_prefix_caching: true

sampling:
  n: 4
  temperature: 0.7
  top_p: 0.95
  top_k: -1
  min_p: 0.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  repetition_penalty: 1.0
  max_tokens: 8192
  min_tokens: 0
  ignore_eos: false
  stop: []
  seed: 0

generation:
  apply_chat_template: true
  enable_thinking: true
  reject_cropped_completions: true

output:
  root: ${oc.env:PROJECT_ROOT,/net/scratch/jiaweizhang/jiazhengw_migration}/data_generation/runs
  run_dir: ${output.root}/${run_name}
  keep_all_generations: true
  keep_intermediate_jsonl: false

cache:
  reuse_identical_runs: true
  resume_interrupted_runs: true
  chunk_size_questions: 64
  force_recompute: false

hydra:
  run:
    dir: ${output.run_dir}
  output_subdir: hydra
