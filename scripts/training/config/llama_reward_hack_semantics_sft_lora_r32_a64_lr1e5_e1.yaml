hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - sft_trainer_engine
  - _self_

model:
  path: meta-llama/Llama-3.1-8B-Instruct
  trust_remote_code: true
  enable_gradient_checkpointing: true
  lora_rank: 32
  lora_alpha: 64

trainer:
  log_episodes: false
  episode_log_dir: logs/${trainer.project_name}/${trainer.experiment_name}
  total_epochs: 1
  default_local_dir: /net/scratch/jiaweizhang/jiazhengw_migration/checkpoints/llama31_8b_reward_hack_semantics_clean_sft_lora_e1
  project_name: reward-hack-sft-semantics
  experiment_name: llama31-8b-reward-hack-semantics-clean-sft-lora-e1
  n_gpus_per_node: 4
  logger:
    - console
    - wandb
  save_freq: after_each_epoch
  max_ckpt_to_keep: 1
  resume_mode: disable

data:
  train_batch_size: 16
  micro_batch_size_per_gpu: 2
  max_length: 4096
  truncation: right
  messages_key: messages
  train_files: /net/scratch/jiaweizhang/jiazhengw_migration/data_generation/runs/matched_reward_hack_sft_arms_20260901/clean/train.parquet
  val_files: /net/scratch/jiaweizhang/jiazhengw_migration/data_generation/runs/matched_reward_hack_sft_arms_20260901/clean/val.parquet
  rllm:
    tokenize_and_mask_method: cumulative
    disable_thinking: true

optim:
  lr: 1.0e-5
